<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a1e0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="RetroLab Calendar - 내 일정을 한눈에 확인하고 구글 캘린더와 연동하여 관리할 수 있는 모바일 웹 캘린더 애플리케이션입니다.">
  <title>RetroLab Calendar</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PC통신 테마용 폰트 -->
  <style>
    @font-face {
      font-family: 'DungGeunMo';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
  </style>

  <!-- PWA Manifest & App Icon -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- CSS (순서 중요: 토큰 → 레이아웃 → 컴포넌트) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>

<body>
  <div class="app-shell">

    <!-- ── 헤더 (연두 리넨) ── -->
    <header class="app-header" id="app-header">
      <div class="app-header__title-group">
        <span class="app-header__year" id="header-year">2026</span>
        <h1 class="app-header__month" id="header-month">6월</h1>
      </div>
      <nav class="app-header__nav" aria-label="달력 탐색">
        <button class="app-header__btn app-header__today-btn" id="btn-today" aria-label="오늘로 이동">오늘</button>
        <button class="app-header__btn" id="btn-prev" aria-label="이전 달">‹</button>
        <button class="app-header__btn" id="btn-next" aria-label="다음 달">›</button>
        <button class="app-header__btn" id="btn-menu" aria-label="설정 메뉴 열기" aria-expanded="false" aria-controls="settings-menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </nav>
    </header>

    <!-- ── 설정 드롭다운 메뉴 ── -->
    <div class="settings-menu" id="settings-menu" aria-hidden="true">
      <ul class="settings-menu__list">
        <li class="settings-menu__item">
          <span class="settings-menu__label">테마</span>
          <div class="motion-toggle">
            <button class="motion-btn theme-btn active" id="btn-theme-vintage" data-theme="vintage" aria-pressed="true">빈티지</button>
            <button class="motion-btn theme-btn"        id="btn-theme-pctel"   data-theme="pctel" aria-pressed="false">PC통신</button>
          </div>
        </li>
        <li class="settings-menu__item">
          <span class="settings-menu__label">전환 효과</span>
          <div class="motion-toggle">
            <button class="motion-btn active" id="btn-motion-cube"  data-motion="cube" aria-pressed="true">큐브 회전</button>
            <button class="motion-btn"        id="btn-motion-door"  data-motion="door" aria-pressed="false">회전문</button>
            <button class="motion-btn"        id="btn-motion-typewriter" data-motion="typewriter" aria-pressed="false">터미널</button>
          </div>
        </li>
        <li class="settings-menu__item settings-menu__google-auth">
          <span class="settings-menu__label">Google 캘린더</span>
          <!-- 로그인 전 -->
          <button class="google-login-btn" id="btn-google-login">
            <svg class="google-login-btn__icon" viewBox="0 0 24 24" width="18" height="18">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Google 계정 로그인</span>
          </button>
          <div class="auto-login-wrapper" id="auto-login-wrapper" style="margin-top: 10px; display: flex; justify-content: flex-end;">
            <label for="auto-login-checkbox" style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.85rem; color: white;">
              <input type="checkbox" id="auto-login-checkbox" style="accent-color: var(--primary-color); width: 14px; height: 14px; cursor: pointer;">
              <span>자동 로그인</span>
            </label>
          </div>
          <!-- 로그인 후 (기본 숨김) -->
          <div class="google-user-info" id="google-user-info" style="display: none;">
            <span class="google-user-info__email" id="google-user-email"></span>
            <button class="google-logout-btn" id="btn-google-logout">로그아웃</button>
          </div>
          <!-- 동기화 상태 표시 -->
          <div class="sync-indicator" id="sync-indicator" style="display: none;">
            <span class="sync-indicator__spinner"></span>
            <span class="sync-indicator__text">동기화 중…</span>
          </div>
        </li>
        <li class="settings-menu__item" style="justify-content: center; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 5px;">
          <a href="privacy.html" style="color: white; font-size: 0.85rem; text-decoration: underline;">개인정보 처리약관</a>
        </li>
      </ul>
    </div>

    <!-- ── 메인 콘텐츠 ── -->
    <main class="app-content">

      <!-- 요일 행 -->
      <div class="weekday-row" id="weekday-row" role="row" aria-label="요일"></div>

      <!-- 날짜 그리드 래퍼 (perspective 컨텍스트) -->
      <div class="calendar-viewport" id="calendar-viewport">
        <div class="date-grid" id="date-grid" role="grid" aria-label="월간 달력"></div>
      </div>

      <!-- 선택된 날짜의 일정 목록 -->
      <section class="schedule-section" aria-label="일정 목록">
        <h2 class="schedule-section__title" id="schedule-title">일정</h2>
        <div class="event-list" id="event-list" role="list"></div>
      </section>

      <!-- 앱 정보 푸터 -->
      <footer style="padding: 20px 15px 30px; text-align: center; margin-top: auto;">
        <div style="display: inline-block; padding-top: 15px; border-top: 1px dashed var(--paper-shadow);">
          <strong style="font-family: var(--font-family); font-size: 0.9rem; color: var(--text-mid); display: block; margin-bottom: 4px; letter-spacing: 0.05em;">RetroLab Calendar</strong>
          <span style="font-size: 0.75rem; color: var(--text-light); line-height: 1.5; font-family: var(--font-family-ui);">
            구글 캘린더와 연동하여 일정을 안전하게 관리하는 모바일 웹 캘린더입니다.
          </span>
        </div>
      </footer>

    </main>

    <!-- ── 플로팅 액션 버튼 (일정 추가) ── -->
    <button class="fab" id="btn-add-event" aria-label="일정 추가">
      <span class="fab__icon">+</span>
    </button>

    <!-- ── 일정 추가/편집 모달 ── -->
    <div class="modal-overlay" id="event-modal-overlay" aria-hidden="true">
      <div class="event-modal" id="event-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="event-modal__header">
          <h2 class="event-modal__title" id="modal-title">새 일정</h2>
          <button class="event-modal__close" id="btn-close-modal" aria-label="닫기">×</button>
        </div>
        
        <form class="event-modal__body" id="event-form">
          <input type="hidden" id="event-id">
          
          <div class="form-group">
            <input type="text" id="event-title" class="form-input" placeholder="일정 제목" required autocomplete="off">
          </div>
          
          <div class="form-group form-group--inline">
            <label class="form-label" for="event-allday">종일</label>
            <input type="checkbox" id="event-allday" class="form-checkbox">
          </div>
          
          <div class="form-group form-group--inline">
            <label class="form-label" for="event-date">날짜</label>
            <input type="date" id="event-date" class="form-input" required>
          </div>
          
          <!-- 시간 입력 래퍼 (테마에 따라 다르게 표시) -->
          <div class="time-picker-container" id="time-picker-container">
            <!-- 1. PC통신 테마용 디지털 입력 -->
            <div class="digital-time-picker" id="digital-time-picker">
              <div class="form-group form-group--inline">
                <label class="form-label">시작</label>
                <input type="time" id="event-start-time" class="form-input">
              </div>
              <div class="form-group form-group--inline">
                <label class="form-label">종료</label>
                <input type="time" id="event-end-time" class="form-input">
              </div>
            </div>
            
            <!-- 2. 빈티지 테마용 텀블러 입력 -->
            <div class="tumbler-time-picker" id="tumbler-time-picker">
              <div class="tumbler-group">
                <span class="tumbler-label">시작</span>
                <div class="tumbler" id="tumbler-start-hour" data-value="12"></div>
                <span class="tumbler-sep">:</span>
                <div class="tumbler" id="tumbler-start-minute" data-value="00"></div>
              </div>
              <div class="tumbler-group">
                <span class="tumbler-label">종료</span>
                <div class="tumbler" id="tumbler-end-hour" data-value="13"></div>
                <span class="tumbler-sep">:</span>
                <div class="tumbler" id="tumbler-end-minute" data-value="00"></div>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <input type="text" id="event-location" class="form-input" placeholder="위치 (선택)" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label class="form-label">색상</label>
            <div class="color-picker" id="event-color-picker">
              <!-- 색상 옵션들은 JS에서 동적 생성 -->
            </div>
            <input type="hidden" id="event-color" value="blue">
          </div>
        </form>
        
        <div class="event-modal__footer">
          <button type="button" class="btn btn--danger" id="btn-delete-event" style="display: none;">삭제</button>
          <button type="submit" form="event-form" class="btn btn--primary" id="btn-save-event">저장</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JS (순서 중요: 의존성 순서대로 로드) -->
  <script src="js/data.js"></script>
  <script src="js/googleAuth.js"></script>
  <script src="js/googleCalendarAPI.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/eventModal.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
