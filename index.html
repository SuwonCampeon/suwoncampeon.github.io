<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#3a1e0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="모바일 웹 캘린더 — 내 일정을 한눈에 확인하세요.">
  <title>캘린더</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- PWA Manifest & App Icon -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon.svg">
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- CSS (순서 중요: 토큰 → 레이아웃 → 컴포넌트) -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/calendar.css">
</head>

<body>
  <div class="app-shell">

    <!-- ── 헤더 (연두 리넨) ── -->
    <header class="app-header" id="app-header">
      <div class="app-header__title-group">
        <span class="app-header__year" id="header-year">2026</span>
        <h1 class="app-header__month" id="header-month">6월</h1>
      </div>
      <nav class="app-header__nav" aria-label="달력 탐색">
        <button class="app-header__btn app-header__today-btn" id="btn-today" aria-label="오늘로 이동">오늘</button>
        <button class="app-header__btn" id="btn-prev" aria-label="이전 달">‹</button>
        <button class="app-header__btn" id="btn-next" aria-label="다음 달">›</button>
        <button class="app-header__btn" id="btn-menu" aria-label="설정 메뉴 열기" aria-expanded="false" aria-controls="settings-menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </nav>
    </header>

    <!-- ── 설정 드롭다운 메뉴 ── -->
    <div class="settings-menu" id="settings-menu" aria-hidden="true">
      <ul class="settings-menu__list">
        <li class="settings-menu__item">
          <span class="settings-menu__label">전환 효과</span>
          <div class="motion-toggle">
            <button class="motion-btn active" id="btn-motion-cube"  data-motion="cube" aria-pressed="true">큐브 회전</button>
            <button class="motion-btn"        id="btn-motion-door"  data-motion="door" aria-pressed="false">회전문</button>
          </div>
        </li>
        <li class="settings-menu__item settings-menu__google-auth">
          <span class="settings-menu__label">Google 캘린더</span>
          <!-- 로그인 전 -->
          <button class="google-login-btn" id="btn-google-login">
            <svg class="google-login-btn__icon" viewBox="0 0 24 24" width="18" height="18">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            <span>Google 계정 로그인</span>
          </button>
          <!-- 로그인 후 (기본 숨김) -->
          <div class="google-user-info" id="google-user-info" style="display: none;">
            <span class="google-user-info__email" id="google-user-email"></span>
            <button class="google-logout-btn" id="btn-google-logout">로그아웃</button>
          </div>
          <!-- 동기화 상태 표시 -->
          <div class="sync-indicator" id="sync-indicator" style="display: none;">
            <span class="sync-indicator__spinner"></span>
            <span class="sync-indicator__text">동기화 중…</span>
          </div>
        </li>
      </ul>
    </div>

    <!-- ── 메인 콘텐츠 ── -->
    <main class="app-content">

      <!-- 요일 행 -->
      <div class="weekday-row" id="weekday-row" role="row" aria-label="요일"></div>

      <!-- 날짜 그리드 래퍼 (perspective 컨텍스트) -->
      <div class="calendar-viewport" id="calendar-viewport">
        <div class="date-grid" id="date-grid" role="grid" aria-label="월간 달력"></div>
      </div>

      <!-- 선택된 날짜의 일정 목록 -->
      <section class="schedule-section" aria-label="일정 목록">
        <h2 class="schedule-section__title" id="schedule-title">일정</h2>
        <div class="event-list" id="event-list" role="list"></div>
      </section>

    </main>

  </div>

  <!-- JS (순서 중요: 의존성 순서대로 로드) -->
  <script src="js/data.js"></script>
  <script src="js/googleAuth.js"></script>
  <script src="js/googleCalendarAPI.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
